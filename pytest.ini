[pytest]
filterwarnings =
    ignore::pytest.PytestAssertRewriteWarning
addopts =
    -p no:faulthandler
# 注：媒体参数（--tracing/--screenshot/--video）、-s、--cache-clear 已收归 run.py 统一管理，
# 避免与 run.py 组装的命令行参数重复或冲突（如 -s 与 --capture=sys 互斥）。
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
log_cli = True
