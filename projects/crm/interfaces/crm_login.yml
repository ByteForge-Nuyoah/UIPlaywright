-
   id: crm_login
   title: CRM 登录接口
   url: /api/crm/v4/user/login
   method: POST
   headers:
    Content-Type: application/json; charset=utf-8;
    # Origin 跟随环境变化；后端如对 Origin 做白名单校验也能通过
    Origin: "${url}"
   request_type: json
   payload:
     username: "${username}"
     password: "${password}"
     appPlatform: "${appPlatform}"
     appVersion: "${appVersion}"
   assert_response:
     status_code: 200
     # TODO: 按实际返回补充 code / 字段断言，例如：
     # assertCode:
     #   message: 断言接口返回码为0
     #   expect_value: 0
     #   assert_type: ==
     #   type_jsonpath: $.code
   assert_sql:
   extract:
