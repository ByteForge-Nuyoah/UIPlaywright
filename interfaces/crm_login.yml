-
   id: crm_login
   title: CRM 登录接口
   url: /api/crm/v4/user/login
   method: POST
   headers:
    Content-Type: application/json; charset=utf-8;
    # Origin 跟随环境变化；后端如对 Origin 做白名单校验也能通过
    Origin: "${url}"
   request_type: json
   payload:
     username: "${username}"
     password: "${password}"
     appPlatform: "${appPlatform}"
     appVersion: "${appVersion}"
   assert_response:
     status_code: 200
     assertName:
       message: 断言接口返回name
       expect_value: "超级管理员 1"
       assert_type: ==
       type_jsonpath: $.data.user.name
   assert_sql:
   extract:
